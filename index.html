<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>لعبة ضربات الجزاء 3D</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #87CEFA;
            font-family: sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
            background: #87CEFA;
        }
        #scoreboard {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            gap: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            z-index: 10;
        }
        .goals { color: #4CAF50; }
        .misses { color: #F44336; }
        #ui-controls {
            position: absolute;
            bottom: 20px;
            right: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 10;
        }
        .btn {
            background: #2196F3;
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        #instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 6px 14px;
            border-radius: 12px;
            font-size: 13px;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="scoreboard">
        <div>الأهداف: <span id="goals-count" class="goals">0</span></div>
        <div>الضائعة: <span id="misses-count" class="misses">0</span></div>
    </div>

    <div id="instructions">اسحب الكرة نحو المرمى للتسديد!</div>

    <div id="ui-controls">
        <button class="btn" onclick="changeKitColor()">تغيير لون القميص</button>
        <button class="btn" onclick="changeShortsColor()">تغيير لون الشورت</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        let goals = 0, misses = 0;
        let shirtColors = ['#d32f2f', '#1976d2', '#388e3c', '#7b1fa2', '#f57c00', '#212121'];
        let shortsColors = ['#ffffff', '#212121', '#1976d2', '#fbc02d'];
        let currentShirtIdx = 0;
        let currentShortsIdx = 0;

        function changeKitColor() {
            currentShirtIdx = (currentShirtIdx + 1) % shirtColors.length;
        }
        function changeShortsColor() {
            currentShortsIdx = (currentShortsIdx + 1) % shortsColors.length;
        }

        // الكرة
        let ball = {
            x: 0, y: 0, z: 1,
            startX: 0, startY: 0,
            vx: 0, vy: 0, vz: 0,
            isKicking: false
        };

        // الحارس
        let keeper = { x: 0, targetX: 0 };

        function resetBall() {
            ball.x = canvas.width / 2;
            ball.y = canvas.height * 0.75;
            ball.z = 1;
            ball.vx = 0; ball.vy = 0; ball.vz = 0;
            ball.isKicking = false;
            keeper.x = canvas.width / 2;
            keeper.targetX = canvas.width / 2;
        }
        resetBall();

        // السحب للتسديد
        let touchX = 0, touchY = 0;
        window.addEventListener('pointerdown', (e) => {
            if (ball.isKicking) return;
            touchX = e.clientX;
            touchY = e.clientY;
        });

        window.addEventListener('pointerup', (e) => {
            if (ball.isKicking) return;
            let dx = e.clientX - touchX;
            let dy = e.clientY - touchY;

            if (dy < -20) {
                ball.isKicking = true;
                ball.vx = dx * 0.15;
                ball.vy = dy * 0.12;
                ball.vz = -0.012;

                // تحريك الحارس
                keeper.targetX = (canvas.width / 2) + (Math.random() - 0.5) * 180;
            }
        });

        let isResultHandled = false;

        function update() {
            if (ball.isKicking) {
                ball.x += ball.vx;
                ball.y += ball.vy;
                ball.z += ball.vz;
                ball.vy += 0.25; // جاذبية

                keeper.x += (keeper.targetX - keeper.x) * 0.1;

                // عند وصول الكرة للمرمى
                if (ball.z <= 0.45 && !isResultHandled) {
                    isResultHandled = true;
                    let goalMinX = canvas.width / 2 - 90;
                    let goalMaxX = canvas.width / 2 + 90;
                    let goalMaxY = canvas.height * 0.42;

                    let distToKeeper = Math.abs(ball.x - keeper.x);

                    if (ball.x >= goalMinX && ball.x <= goalMaxX && ball.y <= goalMaxY && distToKeeper > 45) {
                        goals++;
                        document.getElementById('goals-count').innerText = goals;
                    } else {
                        misses++;
                        document.getElementById('misses-count').innerText = misses;
                    }

                    setTimeout(() => {
                        resetBall();
                        isResultHandled = false;
                    }, 1500);
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. السماء
            ctx.fillStyle = '#87CEFA';
            ctx.fillRect(0, 0, canvas.width, canvas.height * 0.35);

            // 2. المدرجات والجمهور
            ctx.fillStyle = '#444';
            ctx.fillRect(0, canvas.height * 0.28, canvas.width, canvas.height * 0.08);

            let crowdColors = ['#e74c3c', '#3498db', '#f1c40f', '#9b59b6', '#1abc9c'];
            for (let i = 10; i < canvas.width; i += 18) {
                ctx.fillStyle = crowdColors[i % crowdColors.length];
                ctx.fillRect(i, canvas.height * 0.29, 12, 16);
            }

            // 3. الملعب الأخضر
            let fieldGrad = ctx.createLinearGradient(0, canvas.height * 0.35, 0, canvas.height);
            fieldGrad.addColorStop(0, '#2e7d32');
            fieldGrad.addColorStop(1, '#1b5e20');
            ctx.fillStyle = fieldGrad;
            ctx.beginPath();
            ctx.moveTo(0, canvas.height * 0.35);
            ctx.lineTo(canvas.width, canvas.height * 0.35);
            ctx.lineTo(canvas.width * 1.5, canvas.height);
            ctx.lineTo(-canvas.width * 0.5, canvas.height);
            ctx.fill();

            // 4. خط منطقة الجزاء
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(canvas.width * 0.2, canvas.height * 0.6);
            ctx.lineTo(canvas.width * 0.8, canvas.height * 0.6);
            ctx.stroke();

            // 5. المرمى والشبكة
            let gW = 200, gH = 90;
            let gX = canvas.width / 2 - gW / 2;
            let gY = canvas.height * 0.35 - 20;

            // الشبكة
            ctx.strokeStyle = 'rgba(255,255,255,0.4)';
            ctx.lineWidth = 1;
            for (let x = gX; x <= gX + gW; x += 10) {
                ctx.beginPath(); ctx.moveTo(x, gY); ctx.lineTo(x, gY + gH); ctx.stroke();
            }
            for (let y = gY; y <= gY + gH; y += 10) {
                ctx.beginPath(); ctx.moveTo(gX, y); ctx.lineTo(gX + gW, y); ctx.stroke();
            }

            // الأعمدة
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 6;
            ctx.strokeRect(gX, gY, gW, gH);

            // 6. حارس المرمى (قميص أصفر وشورت أبيض)
            let kX = keeper.x, kY = gY + gH - 25;
            ctx.fillStyle = '#fbc02d'; // قميص أصفر
            ctx.fillRect(kX - 10, kY - 20, 20, 22);
            ctx.fillStyle = '#ffffff'; // شورت أبيض
            ctx.fillRect(kX - 10, kY + 2, 20, 10);
            ctx.fillStyle = '#ffdbac'; // رأسه
            ctx.beginPath(); ctx.arc(kX, kY - 26, 7, 0, Math.PI * 2); ctx.fill();

            // 7. اللاعب (قميص وشورت قابلان للتغيير وشعر كثيف)
            let pX = canvas.width / 2 - 50, pY = canvas.height * 0.72;
            ctx.fillStyle = shirtColors[currentShirtIdx]; // قميص
            ctx.fillRect(pX - 12, pY - 25, 24, 25);
            ctx.fillStyle = shortsColors[currentShortsIdx]; // شورت
            ctx.fillRect(pX - 12, pY, 24, 12);
            ctx.fillStyle = '#ffffff'; // جوارب
            ctx.fillRect(pX - 10, pY + 12, 7, 18);
            ctx.fillRect(pX + 3, pY + 12, 7, 18);
            ctx.fillStyle = '#1976d2'; // حذاء أزرق
            ctx.fillRect(pX - 12, pY + 30, 9, 5);
            ctx.fillRect(pX + 3, pY + 30, 9, 5);
            ctx.fillStyle = '#ffdbac'; // رأس
            ctx.beginPath(); ctx.arc(pX, pY - 32, 9, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#1a1a1a'; // شعر كثيف
            ctx.beginPath(); ctx.arc(pX, pY - 35, 11, Math.PI, Math.PI * 2); ctx.fill();

            // 8. الكرة (أبيض وأحمر)
            let bRadius = 18 * ball.z;
            ctx.fillStyle = '#ffffff';
            ctx.beginPath(); ctx.arc(ball.x, ball.y, bRadius, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#d32f2f'; // لون أحمر على الكرة
            ctx.beginPath(); ctx.arc(ball.x - 3, ball.y - 3, bRadius * 0.4, 0, Math.PI * 2); ctx.fill();

            update();
            requestAnimationFrame(draw);
        }

        draw();
    </script>
</body>
</html>
