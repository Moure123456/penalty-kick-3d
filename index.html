<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لعبة ضربات الجزاء 3D</title>
    <style>
        * { box-sizing: border-box; touch-action: none; }
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #87CEFA;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
            background: #87CEFA;
        }
        #scoreboard {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 8px 22px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            gap: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            z-index: 10;
        }
        .goals { color: #4CAF50; }
        .misses { color: #F44336; }
        #ui-controls {
            position: absolute;
            bottom: 20px;
            right: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 10;
        }
        .btn {
            background: #2196F3;
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            cursor: pointer;
        }
        .btn:active { background: #1976D2; }
        #instructions {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            background: rgba(0,0,0,0.75);
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 13px;
            pointer-events: none;
            z-index: 10;
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <div id="scoreboard">
        <div>الأهداف: <span id="goals-count" class="goals">0</span></div>
        <div>الضائعة: <span id="misses-count" class="misses">0</span></div>
    </div>

    <div id="instructions">اسحب الكرة للأعلى باتجاه المرمى للتسديد!</div>

    <div id="ui-controls">
        <button class="btn" id="shirtBtn">تغيير لون القميص</button>
        <button class="btn" id="shortsBtn">تغيير لون الشورت</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        let goals = 0, misses = 0;
        let shirtColors = ['#d32f2f', '#1976d2', '#388e3c', '#7b1fa2', '#f57c00', '#212121'];
        let shortsColors = ['#ffffff', '#212121', '#1976d2', '#fbc02d'];
        let currentShirtIdx = 0;
        let currentShortsIdx = 0;

        document.getElementById('shirtBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            currentShirtIdx = (currentShirtIdx + 1) % shirtColors.length;
        });
        document.getElementById('shortsBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            currentShortsIdx = (currentShortsIdx + 1) % shortsColors.length;
        });

        // متغيرات الكرة
        let ball = {
            x: 0, y: 0, scale: 1,
            vx: 0, vy: 0, vScale: 0,
            isKicking: false
        };

        // متغيرات اللاعب والحارس
        let player = { x: 0, y: 0, kickAnim: 0 };
        let keeper = { x: 0, targetX: 0, y: 0 };

        function resetPositions() {
            ball.x = canvas.width / 2;
            ball.y = canvas.height * 0.82;
            ball.scale = 1;
            ball.vx = 0; ball.vy = 0; ball.vScale = 0;
            ball.isKicking = false;

            player.x = canvas.width / 2 - 45;
            player.y = canvas.height * 0.78;
            player.kickAnim = 0;

            keeper.x = canvas.width / 2;
            keeper.targetX = canvas.width / 2;
        }
        resetPositions();

        // دعم أحداث اللمس والماوس بكفاءة على جميع الهواتف
        let startX = 0, startY = 0;

        function handleStart(x, y) {
            if (ball.isKicking) return;
            startX = x;
            startY = y;
        }

        function handleEnd(x, y) {
            if (ball.isKicking) return;
            let dx = x - startX;
            let dy = y - startY;

            // التأكد من أن السحب للأنشطة نحو المرمى (للأعلى)
            if (dy < -25) {
                ball.isKicking = true;
                player.kickAnim = 1; // تشغيل حركة التسديد

                // سرعة الحركة
                ball.vx = dx * 0.08;
                ball.vy = dy * 0.08;
                ball.vScale = -0.012;

                // تحريك الحارس محاولة للتصدي
                let goalW = Math.min(canvas.width * 0.6, 240);
                keeper.targetX = (canvas.width / 2) + (Math.random() - 0.5) * (goalW - 40);
            }
        }

        // إحداثيات اللمس
        canvas.addEventListener('touchstart', (e) => {
            handleStart(e.touches[0].clientX, e.touches[0].clientY);
        });
        canvas.addEventListener('touchend', (e) => {
            handleEnd(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
        });

        // إحداثيات الماوس
        canvas.addEventListener('mousedown', (e) => handleStart(e.clientX, e.clientY));
        canvas.addEventListener('mouseup', (e) => handleEnd(e.clientX, e.clientY));

        let isResultProcessed = false;

        function update() {
            if (ball.isKicking) {
                // انطلاق الكرة
                ball.x += ball.vx;
                ball.y += ball.vy;
                ball.scale += ball.vScale;
                if (ball.scale < 0.35) ball.scale = 0.35;

                // انقضاض الحارس
                keeper.x += (keeper.targetX - keeper.x) * 0.12;

                // حركة ركلة اللاعب
                if (player.kickAnim > 0) {
                    player.kickAnim += 0.1;
                    if (player.kickAnim > 3) player.kickAnim = 0;
                }

                // حساب الأهداف عند المرمى
                let gY = canvas.height * 0.32;
                if (ball.y <= gY + 30 && !isResultProcessed) {
                    isResultProcessed = true;
                    let goalW = Math.min(canvas.width * 0.6, 240);
                    let gLeft = canvas.width / 2 - goalW / 2;
                    let gRight = canvas.width / 2 + goalW / 2;

                    let distToKeeper = Math.abs(ball.x - keeper.x);

                    if (ball.x >= gLeft + 15 && ball.x <= gRight - 15 && distToKeeper > 35) {
                        goals++;
                        document.getElementById('goals-count').innerText = goals;
                    } else {
                        misses++;
                        document.getElementById('misses-count').innerText = misses;
                    }

                    setTimeout(() => {
                        resetPositions();
                        isResultProcessed = false;
                    }, 1600);
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. السماء والملعب
            ctx.fillStyle = '#87CEFA';
            ctx.fillRect(0, 0, canvas.width, canvas.height * 0.32);

            // المدرجات والجمهور
            ctx.fillStyle = '#333';
            ctx.fillRect(0, canvas.height * 0.25, canvas.width, canvas.height * 0.07);
            let colors = ['#e74c3c', '#3498db', '#f1c40f', '#9b59b6', '#1abc9c', '#e67e22'];
            for (let i = 5; i < canvas.width; i += 16) {
                ctx.fillStyle = colors[i % colors.length];
                ctx.fillRect(i, canvas.height * 0.26, 10, 14);
            }

            // أرضية الملعب الأخضر
            let grass = ctx.createLinearGradient(0, canvas.height * 0.32, 0, canvas.height);
            grass.addColorStop(0, '#2e7d32');
            grass.addColorStop(1, '#1b5e20');
            ctx.fillStyle = grass;
            ctx.fillRect(0, canvas.height * 0.32, canvas.width, canvas.height * 0.68);

            // خط منطقة الجزاء
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(canvas.width * 0.15, canvas.height * 0.62);
            ctx.lineTo(canvas.width * 0.85, canvas.height * 0.62);
            ctx.stroke();

            // 2. المرمى والشبكة
            let goalW = Math.min(canvas.width * 0.6, 240);
            let goalH = 85;
            let gX = canvas.width / 2 - goalW / 2;
            let gY = canvas.height * 0.32 - 15;

            // رسم الشبكة
            ctx.strokeStyle = 'rgba(255,255,255,0.35)';
            ctx.lineWidth = 1;
            for (let x = gX; x <= gX + goalW; x += 12) {
                ctx.beginPath(); ctx.moveTo(x, gY); ctx.lineTo(x, gY + goalH); ctx.stroke();
            }
            for (let y = gY; y <= gY + goalH; y += 12) {
                ctx.beginPath(); ctx.moveTo(gX, y); ctx.lineTo(gX + goalW, y); ctx.stroke();
            }

            // القائمين والعارضة
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 6;
            ctx.strokeRect(gX, gY, goalW, goalH);

            // 3. حارس المرمى (تيشيرت أصفر، شورت أبيض، حذاء رياضي)
            let kX = keeper.x, kY = gY + goalH - 22;
            ctx.fillStyle = '#fbc02d'; // قميص أصفر
            ctx.fillRect(kX - 9, kY - 18, 18, 20);
            ctx.fillStyle = '#ffffff'; // شورت أبيض
            ctx.fillRect(kX - 9, kY + 2, 18, 9);
            ctx.fillStyle = '#333333'; // حذاء
            ctx.fillRect(kX - 9, kY + 11, 6, 4);
            ctx.fillRect(kX + 3, kY + 11, 6, 4);
            ctx.fillStyle = '#ffdbac'; // رأس
            ctx.beginPath(); ctx.arc(kX, kY - 23, 6, 0, Math.PI * 2); ctx.fill();

            // 4. الكرة (أبيض وأحمر)
            let r = 16 * ball.scale;
            ctx.fillStyle = '#ffffff';
            ctx.beginPath(); ctx.arc(ball.x, ball.y, r, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#d32f2f'; // بقع حمراء على الكرة
            ctx.beginPath(); ctx.arc(ball.x - r*0.3, ball.y - r*0.3, r * 0.45, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = '#bbb'; ctx.lineWidth = 1; ctx.stroke();

            // 5. اللاعب (قميص أحمر/متغير، شورت أبيض/متغير، جوارب بيضاء، حذاء أزرق، شعر كثيف)
            let pX = player.x, pY = player.y;
            ctx.fillStyle = shirtColors[currentShirtIdx]; // القميص
            ctx.fillRect(pX - 12, pY - 26, 24, 26);
            ctx.fillStyle = shortsColors[currentShortsIdx]; // الشورت
            ctx.fillRect(pX - 12, pY, 24, 13);
            
            // الجوارب البيضاء والحذاء الأزرق
            ctx.fillStyle = '#ffffff'; // جوارب بيضاء طويلة
            ctx.fillRect(pX - 10, pY + 13, 7, 20);
            ctx.fillRect(pX + 3 + (player.kickAnim > 0 ? 5 : 0), pY + 13 - (player.kickAnim > 0 ? 5 : 0), 7, 20);
            
            ctx.fillStyle = '#1976D2'; // حذاء رياضي أزرق
            ctx.fillRect(pX - 12, pY + 33, 9, 6);
            ctx.fillRect(pX + 3 + (player.kickAnim > 0 ? 5 : 0), pY + 33 - (player.kickAnim > 0 ? 5 : 0), 9, 6);

            ctx.fillStyle = '#ffdbac'; // الوجه
            ctx.beginPath(); ctx.arc(pX, pY - 33, 9, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#1a1a1a'; // شعر كثيف
            ctx.beginPath(); ctx.arc(pX, pY - 36, 11, Math.PI, Math.PI * 2); ctx.fill();

            update();
            requestAnimationFrame(draw);
        }

        draw();
    </script>
</body>
</html>
