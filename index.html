<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لعبة ضربات الجزاء 3D الاحترافية</title>
    <style>
        * { box-sizing: border-box; touch-action: none; margin: 0; padding: 0; }
        body {
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        #webgl-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #scoreboard {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            color: #fff;
            padding: 12px 30px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: 800;
            display: flex;
            gap: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }
        .goals { color: #10B981; text-shadow: 0 0 10px rgba(16,185,129,0.5); }
        .misses { color: #EF4444; text-shadow: 0 0 10px rgba(239,68,68,0.5); }
        #ui-controls {
            position: absolute;
            bottom: 25px;
            right: 25px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 10;
        }
        .btn {
            background: linear-gradient(135deg, #2563EB, #1D4ED8);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.4);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn:hover { transform: translateY(-2px); }
        .btn:active { transform: translateY(1px); }
        #instructions {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: #F8FAFC;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(8px);
            padding: 10px 24px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            pointer-events: none;
            z-index: 10;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        #banner {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-size: 48px;
            font-weight: 900;
            text-shadow: 0 10px 20px rgba(0,0,0,0.8);
            z-index: 20;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
        }
        .goal-banner { color: #10B981; }
        .miss-banner { color: #EF4444; }
    </style>
    <!-- تضمين مكتبة Three.js لجرافيك 3D -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="scoreboard">
        <div>الأهداف: <span id="goals-count" class="goals">0</span></div>
        <div>الضائعة: <span id="misses-count" class="misses">0</span></div>
    </div>

    <div id="instructions">اسحب الكرة للأعلى باتجاه المرمى للتسديد!</div>

    <div id="banner"></div>

    <div id="ui-controls">
        <button class="btn" id="shirtBtn">تغيير لون القميص</button>
        <button class="btn" id="shortsBtn">تغيير لون الشورت</button>
    </div>

    <div id="webgl-container"></div>

    <script>
        // --- 1. إعداد المحرك والأصوات Synthetic Sound Engine ---
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioCtx();
        }

        function playKickSound() {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(120, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.15);
            gain.gain.setValueAtTime(1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.15);
        }

        function playSaveSound() {
            initAudio();
            const bufferSize = audioCtx.sampleRate * 0.2;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.value = 400;

            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(0.8, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);

            noise.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);
            noise.start();
        }

        function playCheerSound() {
            initAudio();
            const duration = 2.5;
            const bufferSize = audioCtx.sampleRate * duration;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.value = 800;
            filter.Q.value = 1.5;

            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(0.01, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.5, audioCtx.currentTime + 0.5);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);

            noise.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);
            noise.start();
        }

        // --- 2. إعداد مشهد 3D (Scene, Camera, Renderer) ---
        const container = document.getElementById('webgl-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.FogExp2(0x87CEEB, 0.012);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2.2, 10);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // --- 3. الإضاءة Lighting ---
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.6);
        hemiLight.position.set(0, 50, 0);
        scene.add(hemiLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(-20, 40, 20);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 100;
        dirLight.shadow.camera.left = -20;
        dirLight.shadow.camera.right = 20;
        dirLight.shadow.camera.top = 20;
        dirLight.shadow.camera.bottom = -20;
        scene.add(dirLight);

        // --- 4. بناء عناصر البيئة (الملعب، المرمى، الجمهور) ---
        // العشب
        const pitchGeo = new THREE.PlaneGeometry(80, 100);
        const pitchMat = new THREE.MeshStandardMaterial({ color: 0x2e7d32, roughness: 0.8 });
        const pitch = new THREE.Mesh(pitchGeo, pitchMat);
        pitch.rotation.x = -Math.PI / 2;
        pitch.receiveShadow = true;
        scene.add(pitch);

        // شرائط العشب الملونة
        for (let i = -50; i < 50; i += 5) {
            if ((i / 5) % 2 === 0) {
                const stripeGeo = new THREE.PlaneGeometry(80, 5);
                const stripeMat = new THREE.MeshStandardMaterial({ color: 0x388e3c, roughness: 0.8 });
                const stripe = new THREE.Mesh(stripeGeo, stripeMat);
                stripe.rotation.x = -Math.PI / 2;
                stripe.position.set(0, 0.01, i + 2.5);
                stripe.receiveShadow = true;
                scene.add(stripe);
            }
        }

        // خط منطقة الجزاء
        const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const penLine = new THREE.Mesh(new THREE.PlaneGeometry(24, 0.2), lineMat);
        penLine.rotation.x = -Math.PI / 2;
        penLine.position.set(0, 0.02, 0);
        scene.add(penLine);

        // المرمى (Goal Posts)
        const postMat = new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 0.2, roughness: 0.3 });
        const goalGroup = new THREE.Group();
        
        const postRadius = 0.12;
        const goalWidth = 7.32;
        const goalHeight = 2.44;

        // القائم الأيسر والأيمن
        const leftPost = new THREE.Mesh(new THREE.CylinderGeometry(postRadius, postRadius, goalHeight), postMat);
        leftPost.position.set(-goalWidth / 2, goalHeight / 2, -15);
        leftPost.castShadow = true;

        const rightPost = leftPost.clone();
        rightPost.position.x = goalWidth / 2;

        // العارضة
        const crossbar = new THREE.Mesh(new THREE.CylinderGeometry(postRadius, postRadius, goalWidth), postMat);
        crossbar.rotation.z = Math.PI / 2;
        crossbar.position.set(0, goalHeight, -15);
        crossbar.castShadow = true;

        goalGroup.add(leftPost, rightPost, crossbar);

        // شبكة المرمى (Goal Net)
        const netGeo = new THREE.PlaneGeometry(goalWidth, goalHeight, 20, 10);
        const netMat = new THREE.MeshBasicMaterial({ color: 0xdddddd, wireframe: true, transparent: true, opacity: 0.4 });
        const net = new THREE.Mesh(netGeo, netMat);
        net.position.set(0, goalHeight / 2, -16.5);
        goalGroup.add(net);
        scene.add(goalGroup);

        // الجمهور (Stadium Crowd)
        const crowdGeo = new THREE.BufferGeometry();
        const crowdCount = 1500;
        const crowdPositions = new Float32Array(crowdCount * 3);
        const crowdColors = new Float32Array(crowdCount * 3);

        for (let i = 0; i < crowdCount; i++) {
            crowdPositions[i * 3] = (Math.random() - 0.5) * 70;
            crowdPositions[i * 3 + 1] = 4 + Math.random() * 8;
            crowdPositions[i * 3 + 2] = -20 - Math.random() * 15;

            crowdColors[i * 3] = Math.random();
            crowdColors[i * 3 + 1] = Math.random();
            crowdColors[i * 3 + 2] = Math.random();
        }
        crowdGeo.setAttribute('position', new THREE.BufferAttribute(crowdPositions, 3));
        crowdGeo.setAttribute('color', new THREE.BufferAttribute(crowdColors, 3));
        const crowdMat = new THREE.PointsMaterial({ size: 0.4, vertexColors: true });
        const crowd = new THREE.Points(crowdGeo, crowdMat);
        scene.add(crowd);

        // --- 5. إنشاء كرة القدم (Football 3D) ---
        const ballRadius = 0.24;
        const ballGeo = new THREE.SphereGeometry(ballRadius, 32, 32);
        const ballMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.4 });
        const ballMesh = new THREE.Mesh(ballGeo, ballMat);
        ballMesh.castShadow = true;
        scene.add(ballMesh);

        // بقع سوداء على الكرة للتفاصيل
        for(let i=0; i<6; i++) {
            const spotGeo = new THREE.BufferGeometry();
            const spotMat = new THREE.MeshBasicMaterial({color: 0x111111});
            const spot = new THREE.Mesh(new THREE.SphereGeometry(ballRadius * 1.01, 8, 8), spotMat);
            spot.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, 0);
            ballMesh.add(spot);
        }

        // --- 6. بناء مجسمات اللاعبين 3D ---
        const shirtMaterials = [
            new THREE.MeshStandardMaterial({ color: 0xd32f2f, roughness: 0.5 }), // أحمر
            new THREE.MeshStandardMaterial({ color: 0x1976d2, roughness: 0.5 }), // أزرق
            new THREE.MeshStandardMaterial({ color: 0x388e3c, roughness: 0.5 }), // أخضر
            new THREE.MeshStandardMaterial({ color: 0x7b1fa2, roughness: 0.5 }), // بنفسجي
            new THREE.MeshStandardMaterial({ color: 0xf57c00, roughness: 0.5 })  // برتقالي
        ];

        const shortsMaterials = [
            new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5 }), // أبيض
            new THREE.MeshStandardMaterial({ color: 0x212121, roughness: 0.5 }), // أسود
            new THREE.MeshStandardMaterial({ color: 0x1976d2, roughness: 0.5 })  // أزرق
        ];

        let currentShirtIdx = 0;
        let currentShortsIdx = 0;

        function createHumanoid(shirtMat, shortsMat, skinColor = 0xffdbac) {
            const group = new THREE.Group();
            const skinMat = new THREE.MeshStandardMaterial({ color: skinColor, roughness: 0.6 });

            // الجذع / القميص
            const torso = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.7, 0.3), shirtMat);
            torso.position.y = 1.25;
            torso.castShadow = true;
            group.add(torso);

            // الرأس
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.18, 16, 16), skinMat);
            head.position.y = 1.75;
            head.castShadow = true;
            group.add(head);

            // الشورت
            const shorts = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.35, 0.32), shortsMat);
            shorts.position.y = 0.82;
            shorts.castShadow = true;
            group.add(shorts);

            // الأرجل (حاملة للحركة)
            const legGeo = new THREE.CylinderGeometry(0.08, 0.07, 0.65);
            
            const leftLeg = new THREE.Mesh(legGeo, skinMat);
            leftLeg.position.set(-0.18, 0.35, 0);
            leftLeg.castShadow = true;
            group.add(leftLeg);

            const rightLeg = new THREE.Mesh(legGeo, skinMat);
            rightLeg.position.set(0.18, 0.35, 0);
            rightLeg.castShadow = true;
            group.add(rightLeg);

            return { group, leftLeg, rightLeg, torso, head };
        }

        // إنشاء المهاجم وحارس المرمى
        const playerObj = createHumanoid(shirtMaterials[currentShirtIdx], shortsMaterials[currentShortsIdx]);
        scene.add(playerObj.group);

        const keeperMat = new THREE.MeshStandardMaterial({ color: 0xfbc02d, roughness: 0.5 }); // أصفر
        const keeperObj = createHumanoid(keeperMat, shortsMaterials[0]);
        scene.add(keeperObj.group);

        // --- 7. منطق الحركة والتسديد (Game Logic) ---
        let goals = 0, misses = 0;
        let isKicking = false;
        let isResultProcessed = false;

        let ballVel = new THREE.Vector3();
        let keeperTargetX = 0;
        let keeperTargetY = 1.2;

        function resetMatch() {
            ballMesh.position.set(0, ballRadius, 4.5);
            ballVel.set(0, 0, 0);

            playerObj.group.position.set(-0.8, 0, 5.8);
            playerObj.group.rotation.y = 0.2;
            playerObj.rightLeg.rotation.x = 0;

            keeperObj.group.position.set(0, 0, -14.5);
            keeperObj.group.rotation.y = 0;
            keeperObj.group.position.y = 0;

            camera.position.set(0, 2.0, 8.5);
            camera.lookAt(0, 1.2, -15);

            isKicking = false;
            isResultProcessed = false;
            document.getElementById('banner').style.transform = 'translate(-50%, -50%) scale(0)';
        }
        resetMatch();

        // التفاعل وتغيير الملابس
        document.getElementById('shirtBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            currentShirtIdx = (currentShirtIdx + 1) % shirtMaterials.length;
            playerObj.torso.material = shirtMaterials[currentShirtIdx];
        });

        document.getElementById('shortsBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            currentShortsIdx = (currentShortsIdx + 1) % shortsMaterials.length;
            playerObj.shorts.material = shortsMaterials[currentShortsIdx];
        });

        // التقاط حركة السحب (Swipe Control)
        let touchStartX = 0, touchStartY = 0;

        function onPointerDown(x, y) {
            if (isKicking) return;
            touchStartX = x;
            touchStartY = y;
        }

        function onPointerUp(x, y) {
            if (isKicking) return;
            const dx = x - touchStartX;
            const dy = y - touchStartY;

            if (dy < -30) { // سحب للأعلى
                playKickSound();
                isKicking = true;

                // حساب سرعة الكرة ثلاثية الأبعاد بناءً على قوة واتجاه السحب
                const speed = Math.min(Math.abs(dy) * 0.0008, 0.45);
                ballVel.x = dx * 0.008;
                ballVel.y = Math.min(Math.abs(dy) * 0.004, 0.28);
                ballVel.z = -speed - 0.25;

                // حركة ركلة المهاجم
                playerObj.rightLeg.rotation.x = -Math.PI / 3;

                // تحريك الحارس تلقائياً للتصدي (ذكاء اصطناعي بسيط)
                keeperTargetX = (Math.random() - 0.5) * (goalWidth - 1);
                keeperTargetY = Math.random() > 0.5 ? 1.5 : 0;
            }
        }

        window.addEventListener('mousedown', e => onPointerDown(e.clientX, e.clientY));
        window.addEventListener('mouseup', e => onPointerUp(e.clientX, e.clientY));
        window.addEventListener('touchstart', e => onPointerDown(e.touches[0].clientX, e.touches[0].clientY));
        window.addEventListener('touchend', e => onPointerUp(e.changedTouches[0].clientX, e.changedTouches[0].clientY));

        function showBanner(text, isGoal) {
            const banner = document.getElementById('banner');
            banner.innerText = text;
            banner.className = isGoal ? 'goal-banner' : 'miss-banner';
            banner.style.transform = 'translate(-50%, -50%) scale(1)';
        }

        // --- 8. حلقة التحديث والرسم (Animation Loop) ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            if (isKicking) {
                // تحديث موقع الكرة
                ballMesh.position.add(ballVel);
                ballVel.y -= 0.008; // تأثير الجاذبية
                if (ballMesh.position.y < ballRadius) {
                    ballMesh.position.y = ballRadius;
                    ballVel.y *= -0.5; // ارتداد من الأرض
                }

                // دوران الكرة أثناء الطيران
                ballMesh.rotation.x += 0.1;
                ballMesh.rotation.y += 0.05;

                // انقضاض الحارس نحو الهدف
                keeperObj.group.position.x += (keeperTargetX - keeperObj.group.position.x) * 0.1;
                if (keeperTargetY > 0) {
                    keeperObj.group.position.y += (keeperTargetY - keeperObj.group.position.y) * 0.1;
                    keeperObj.group.rotation.z = -keeperTargetX * 0.1;
                }

                // الكاميرا تتبع الكرة بمرونة
                camera.position.x += (ballMesh.position.x * 0.3 - camera.position.x) * 0.05;
                camera.position.y += (2.0 + ballMesh.position.y * 0.2 - camera.position.y) * 0.05;

                // التحقق من الهدف أو الصد عند خط المرمى
                if (ballMesh.position.z <= -14.8 && !isResultProcessed) {
                    isResultProcessed = true;

                    const distToKeeper = ballMesh.position.distanceTo(keeperObj.group.position);
                    const inGoalX = Math.abs(ballMesh.position.x) < (goalWidth / 2 - 0.2);
                    const inGoalY = ballMesh.position.y < (goalHeight - 0.1) && ballMesh.position.y > 0.2;

                    if (distToKeeper < 1.2) { // الحارس صد الكرة
                        playSaveSound();
                        showBanner('تم التصدي!', false);
                        misses++;
                        document.getElementById('misses-count').innerText = misses;
                        ballVel.set(0, 0.1, 0.2); // ارتداد الكرة من الحارس
                    } else if (inGoalX && inGoalY) { // هدف!
                        playCheerSound();
                        showBanner('جووووول!', true);
                        goals++;
                        document.getElementById('goals-count').innerText = goals;
                        ballVel.multiplyScalar(0.2); // تباطؤ عند الاططدام بالشبكة
                    } else { // خارج المرمى
                        showBanner('خارج المرمى!', false);
                        misses++;
                        document.getElementById('misses-count').innerText = misses;
                    }

                    setTimeout(resetMatch, 2200);
                }
            }

            renderer.render(scene, camera);
        }

        // ضبط الشاشة عند تغيير الحجم
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
