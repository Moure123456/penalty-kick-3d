<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لعبة ضربات الجزاء 3D - الجرافيك المطور</title>
    <style>
        * { box-sizing: border-box; touch-action: none; margin: 0; padding: 0; }
        body {
            overflow: hidden;
            background-color: #050b14;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        #webgl-container { width: 100vw; height: 100vh; display: block; }
        #scoreboard {
            position: absolute;
            top: 20px; left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            color: #fff;
            padding: 10px 25px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 800;
            display: flex; gap: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 15px 25px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }
        .level { color: #F59E0B; }
        .goals { color: #10B981; }
        .shots { color: #3B82F6; }
        #instructions {
            position: absolute; bottom: 25px; left: 50%;
            transform: translateX(-50%);
            color: #F8FAFC; background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px); padding: 10px 24px;
            border-radius: 20px; font-size: 14px; font-weight: 600;
            pointer-events: none; z-index: 10;
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
        }
        #banner {
            position: absolute; top: 35%; left: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-size: 42px; font-weight: 900;
            text-shadow: 0 10px 20px rgba(0,0,0,0.8);
            z-index: 20; transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none; text-align: center;
        }
        .goal-banner { color: #10B981; }
        .miss-banner { color: #EF4444; }
        .win-banner { color: #F59E0B; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="scoreboard">
        <div>المستوى: <span id="level-count" class="level">1</span></div>
        <div>الأهداف: <span id="goals-count" class="goals">0</span></div>
        <div>الرميات: <span id="shots-count" class="shots">0 / 5</span></div>
    </div>

    <div id="instructions">اسحب الكرة مع التوجيه - استخدم خط التصويب النيون للحصول على أدق تسديدة!</div>
    <div id="banner"></div>

    <div id="webgl-container"></div>

    <script>
        // --- 1. الأصوات الاصطناعية ---
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        function initAudio() { if (!audioCtx) audioCtx = new AudioCtx(); }

        function playKickSound() {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.18);
            gain.gain.setValueAtTime(1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.18);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.18);
        }

        function playSaveSound() {
            initAudio();
            const bufferSize = audioCtx.sampleRate * 0.2;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;
            const filter = audioCtx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = 500;
            const gain = audioCtx.createGain(); gain.gain.setValueAtTime(0.8, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
            noise.start();
        }

        function playCheerSound() {
            initAudio();
            const duration = 2.5;
            const bufferSize = audioCtx.sampleRate * duration;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
            const noise = audioCtx.createBufferSource(); noise.buffer = buffer;
            const filter = audioCtx.createBiquadFilter(); filter.type = 'bandpass'; filter.frequency.value = 850; filter.Q.value = 1.2;
            const gain = audioCtx.createGain(); gain.gain.setValueAtTime(0.01, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.6, audioCtx.currentTime + 0.4);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
            noise.start();
        }

        // --- 2. إعداد المشهد ثلاثي الأبعاد المطور ---
        const container = document.getElementById('webgl-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a2b3c);
        scene.fog = new THREE.FogExp2(0x1a2b3c, 0.008);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        container.appendChild(renderer.domElement);

        // إضاءة احترافية
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xfffaed, 1.2);
        dirLight.position.set(-20, 35, 15);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        // --- 3. الملعب والمرمى ---
        const pitchMat = new THREE.MeshStandardMaterial({ color: 0x1e6b2c, roughness: 0.6, metalness: 0.1 });
        const pitch = new THREE.Mesh(new THREE.PlaneGeometry(80, 100), pitchMat);
        pitch.rotation.x = -Math.PI / 2; pitch.receiveShadow = true;
        scene.add(pitch);

        const goalGroup = new THREE.Group();
        const postMat = new THREE.MeshStandardMaterial({ color: 0xf5f5f5, roughness: 0.2, metalness: 0.3 });
        const goalWidth = 7.32, goalHeight = 2.44;

        const leftPost = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, goalHeight), postMat);
        leftPost.position.set(-goalWidth / 2, goalHeight / 2, -15);
        const rightPost = leftPost.clone(); rightPost.position.x = goalWidth / 2;
        const crossbar = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, goalWidth), postMat);
        crossbar.rotation.z = Math.PI / 2; crossbar.position.set(0, goalHeight, -15);
        goalGroup.add(leftPost, rightPost, crossbar);

        const net = new THREE.Mesh(new THREE.PlaneGeometry(goalWidth, goalHeight, 24, 12), new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true, transparent: true, opacity: 0.3 }));
        net.position.set(0, goalHeight / 2, -16);
        goalGroup.add(net); scene.add(goalGroup);

        // --- 4. مؤشر مسار التسديد الذكي (Aim Curve Guide Line) ---
        const aimLineGeo = new THREE.BufferGeometry();
        const aimPositions = new Float32Array(30 * 3);
        aimLineGeo.setAttribute('position', new THREE.BufferAttribute(aimPositions, 3));
        const aimLineMat = new THREE.LineBasicMaterial({ color: 0x00ffcc, linewidth: 3, transparent: true, opacity: 0.8 });
        const aimLine = new THREE.Line(aimLineGeo, aimLineMat);
        aimLine.visible = false;
        scene.add(aimLine);

        // --- 5. كرة القدم واللاعبين ---
        const ballRadius = 0.23;
        const ballMesh = new THREE.Mesh(new THREE.SphereGeometry(ballRadius, 32, 32), new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 }));
        ballMesh.castShadow = true; scene.add(ballMesh);

        function createHumanoid(shirtColor, shortsColor) {
            const player = new THREE.Group();
            const skinMat = new THREE.MeshStandardMaterial({ color: 0xc68642, roughness: 0.6 });
            const shirtMat = new THREE.MeshStandardMaterial({ color: shirtColor, roughness: 0.4 });
            const shortsMat = new THREE.MeshStandardMaterial({ color: shortsColor, roughness: 0.4 });

            const head = new THREE.Mesh(new THREE.SphereGeometry(0.18, 16, 16), skinMat);
            head.position.y = 1.75; player.add(head);

            const torso = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.65, 0.28), shirtMat);
            torso.position.y = 1.25; player.add(torso);

            const shorts = new THREE.Mesh(new THREE.BoxGeometry(0.52, 0.3, 0.3), shortsMat);
            shorts.position.y = 0.85; player.add(shorts);

            const legGeo = new THREE.CylinderGeometry(0.07, 0.06, 0.6);
            const legR = new THREE.Mesh(legGeo, skinMat); legR.position.set(0.16, 0.35, 0); player.add(legR);
            const legL = new THREE.Mesh(legGeo, skinMat); legL.position.set(-0.16, 0.35, 0); player.add(legL);

            return { group: player, torso, shorts, legR, legL };
        }

        const playerObj = createHumanoid(0xd32f2f, 0xffffff);
        scene.add(playerObj.group);

        const keeperObj = createHumanoid(0xfbc02d, 0x111111);
        scene.add(keeperObj.group);

        // --- 6. نظام التحكم والفيزياء المطور ---
        let level = 1, goals = 0, totalShots = 0, maxShots = 5;
        let isKicking = false, isTouching = false, isResultProcessed = false;
        let ballVel = new THREE.Vector3(), ballCurve = 0;

        function resetPositions() {
            ballMesh.position.set(0, ballRadius, 4.5);
            ballVel.set(0, 0, 0); ballCurve = 0;

            playerObj.group.position.set(-0.6, 0, 5.5);
            playerObj.group.rotation.set(0, 0.2, 0);
            playerObj.legR.rotation.x = 0; playerObj.legL.rotation.x = 0;

            keeperObj.group.position.set(0, 0, -14.5);
            keeperObj.group.rotation.set(0, 0, 0);
            keeperObj.group.position.y = 0;

            camera.position.set(0, 1.8, 8.0); camera.lookAt(0, 1.2, -15);
            isKicking = false; isTouching = false; isResultProcessed = false;
            aimLine.visible = false;
            document.getElementById('banner').style.transform = 'translate(-50%, -50%) scale(0)';
        }
        resetPositions();

        // تحديث رسم مسار التسديد ذو خط النيون
        function updateAimLine(dx, dy) {
            const positions = aimLine.geometry.attributes.position.array;
            let tempX = ballMesh.position.x;
            let tempY = ballMesh.position.y;
            let tempZ = ballMesh.position.z;

            let vx = dx * 0.005;
            let vy = Math.min(Math.abs(dy) * 0.0035, 0.25);
            let vz = -Math.min(Math.abs(dy) * 0.0009, 0.42) - 0.22;
            let curve = dx * 0.00015;

            for (let i = 0; i < 30; i++) {
                positions[i * 3] = tempX;
                positions[i * 3 + 1] = tempY;
                positions[i * 3 + 2] = tempZ;

                vx += curve;
                tempX += vx;
                tempY += vy;
                vy -= 0.007; // gravity
                tempZ += vz;
            }
            aimLine.geometry.attributes.position.needsUpdate = true;
            aimLine.visible = true;
        }

        function executeBallKick(dx, dy) {
            playKickSound();
            totalShots++;
            document.getElementById('shots-count').innerText = `${totalShots} / ${maxShots}`;

            const speed = Math.min(Math.abs(dy) * 0.0009, 0.42);
            ballVel.x = dx * 0.005;
            ballVel.y = Math.min(Math.abs(dy) * 0.0035, 0.25);
            ballVel.z = -speed - 0.22;
            ballCurve = dx * 0.00015;

            const targetX = ballVel.x * 35;
            keeperObj.group.position.x = Math.max(-goalWidth/2, Math.
