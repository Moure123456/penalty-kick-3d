<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لعبة صياد السمك الاحترافية</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Cairo', Arial, sans-serif;
            background: #4fc3f7;
            touch-action: none;
        }
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #1976d2, #4fc3f7 70%, #ffcc80 70%);
            transition: background 1s ease;
        }
        /* لوحة العدادات العلوية */
        #ui-bar {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 8px 15px;
            border-radius: 20px;
            display: flex;
            gap: 15px;
            font-size: 15px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            z-index: 100;
        }
        /* منطقة الرسائل والإرشادات */
        #msg-box {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.75);
            color: white;
            padding: 6px 15px;
            border-radius: 15px;
            font-size: 13px;
            z-index: 100;
            text-align: center;
            pointer-events: none;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        /* وضع الليل */
        .night-mode {
            background: linear-gradient(to bottom, #050b14, #0d1b2a 70%, #3e2723 70%) !important;
        }
        .night-mode #ui-bar {
            background: rgba(15, 23, 42, 0.9) !important;
            color: #fff !important;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="ui-bar">
            <div>النقاط: <span id="score">0</span> pi</div>
            <div>المحفظة: <span id="wallet">0</span> pi</div>
            <div>الحالة: <span id="status">نهار ☀️</span></div>
        </div>
        <canvas id="gameCanvas"></canvas>
        <div id="msg-box">امسح واسحب الشاشة لتحريك الصنارة وصيد الأسماك وضعها بالسلة!</div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('game-container');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let score = 0;
        let wallet = 0;
        let isNight = false;

        // إحداثيات اللمس والخطاف
        let hookX = canvas.width * 0.3;
        let hookY = canvas.height * 0.5;
        let isTouching = false;
        let hookedFish = null;

        // إحداثيات الصياد والشاطئ
        const fishermanX = canvas.width * 0.2;
        const groundY = canvas.height * 0.7;

        // النجوم للوضع الليلي
        const stars = [];
        for(let i=0; i<40; i++) {
            stars.push({x: Math.random() * canvas.width, y: Math.random() * (groundY * 0.6), size: Math.random() * 2 + 1});
        }

        // مصفوفة الأسماك
        let fishes = [];
        const fishTypes = [
            { name: 'حوت أبيض', value: 100, color: '#f5f5f5', size: 45, speed: 1.2, type: 'whale' },
            { name: 'قرش أحمر', value: 50, color: '#e53935', size: 35, speed: 1.8, type: 'shark' },
            { name: 'سمكة ملونة', value: 20, color: '#ffb300', size: 25, speed: 2.3, type: 'normal' },
            { name: 'سمكة صغيرة', value: 10, color: '#43a047', size: 18, speed: 2.8, type: 'small' }
        ];

        function spawnFish() {
            if(fishes.length < 6) {
                let template = fishTypes[Math.floor(Math.random() * fishTypes.length)];
                fishes.push({
                    x: Math.random() > 0.5 ? -60 : canvas.width + 60,
                    y: groundY * 0.2 + Math.random() * (groundY * 0.45),
                    vx: (Math.random() > 0.5 ? 1 : -1) * template.speed,
                    ...template,
                    wiggle: Math.random() * 10
                });
            }
        }
        setInterval(spawnFish, 2200);

        // التفاعل عبر اللمس للأندرويد
        window.addEventListener('touchstart', handleTouch);
        window.addEventListener('touchmove', handleTouch);
        window.addEventListener('touchend', () => { isTouching = false; });

        // التفاعل عبر الماوس أيضاً للاختبار على المتصفح
        window.addEventListener('mousedown', (e) => { isTouching = true; updateHookPos(e.clientX, e.clientY); });
        window.addEventListener('mousemove', (e) => { if(isTouching) updateHookPos(e.clientX, e.clientY); });
        window.addEventListener('mouseup', () => { isTouching = false; });

        function handleTouch(e) {
            isTouching = true;
            let touch = e.touches[0];
            updateHookPos(touch.clientX, touch.clientY);
            e.preventDefault();
        }

        function updateHookPos(x, y) {
            hookX = x;
            hookY = y;

            // إذا لم تكن هناك سمكة مشبوكة، ابحث عن سمكة قريبة لتشبيكها
            if(!hookedFish) {
                fishes.forEach(fish => {
                    let dist = Math.hypot(hookX - fish.x, hookY - fish.y);
                    if(dist < 50) {
                        hookedFish = fish; // تشبيك السمكة بالصنارة
                    }
                });
            } else {
                // إذا كانت مشبوكة، تتحرك مع حركة الإصبع وتتذذب (تملص)
                hookedFish.x = hookX + (Math.random() - 0.5) * 15;
                hookedFish.y = hookY + (Math.random() - 0.5) * 15;

                // إذا اقتربت من السلة (بجوار الصياد)، يتم وضعها فيها!
                let basketX = fishermanX + 45;
                let basketY = groundY - 20;
                if(Math.hypot(hookX - basketX, hookY - basketY) < 60) {
                    score += hookedFish.value;
                    document.getElementById('score').innerText = score;
                    
                    // إزالة السمكة
                    fishes = fishes.filter(f => f !== hookedFish);
                    hookedFish = null;

                    // التحقق من نظام 200 pi والوضع الليلي
                    if(score >= 200) {
                        wallet += score;
                        score = 0;
                        document.getElementById('wallet').innerText = wallet;
                        document.getElementById('score').innerText = score;
                        
                        isNight = true;
                        container.classList.add('night-mode');
                        document.getElementById('status').innerText = "ليل 🌙";
                    }
                }
            }
        }

        // رسم اللعبة بشكل احترافي
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. رسم النجوم في الليل
            if(isNight) {
                ctx.fillStyle = "#ffffff";
                stars.forEach(s => {
                    ctx.fillRect(s.x, s.y, s.size, s.size);
                });
                // رسم القمر
                ctx.fillStyle = "#fff9c4";
                ctx.beginPath();
                ctx.arc(canvas.width - 70, 70, 25, 0, Math.PI * 2);
                ctx.fill();
            }

            // 2. رسم المراكب في البحر
            ctx.fillStyle = isNight ? "#37474f" : "#8d6e63";
            ctx.beginPath();
            ctx.moveTo(canvas.width * 0.65, groundY - 40);
            ctx.lineTo(canvas.width * 0.8, groundY - 40);
            ctx.lineTo(canvas.width * 0.77, groundY - 10);
            ctx.lineTo(canvas.width * 0.68, groundY - 10);
            ctx.fill();
            // شراع المركب
            ctx.fillStyle = "#ffffff";
            ctx.beginPath();
            ctx.moveTo(canvas.width * 0.72, groundY - 40);
            ctx.lineTo(canvas.width * 0.72, groundY - 80);
            ctx.lineTo(canvas.width * 0.76, groundY - 50);
            ctx.fill();

            // 3. رسم الشاطئ والأرضية
            ctx.fillStyle = isNight ? "#3e2723" : "#ffcc80";
            ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);

            // 4. رسم الكرسي والسلة
            // الكرسي
            ctx.fillStyle = "#795548";
            ctx.fillRect(fishermanX + 15, groundY - 25, 25, 25);
            ctx.fillRect(fishermanX + 15, groundY - 45, 5, 20);
            // السلة بجوار الصياد
            ctx.fillStyle = "#d7ccc8";
            ctx.beginPath();
            ctx.arc(fishermanX + 55, groundY - 15, 18, 0, Math.PI, false);
            ctx.fill();
            ctx.strokeStyle = "#5d4037";
            ctx.lineWidth = 2;
            ctx.stroke();

            // 5. رسم الصياد (بشكل بشري واضح: كاب، صُديري، شورت)
            const fx = fishermanX;
            const fy = groundY;

            // الحذاء والرجلين
            ctx.fillStyle = "#3e2723";
            ctx.fillRect(fx - 10, fy - 15, 8, 15);
            ctx.fillRect(fx + 2, fy - 15, 8, 15);

            // الشورت (أزرق)
            ctx.fillStyle = "#1565c0";
            ctx.fillRect(fx - 12, fy - 35, 24, 22);

            // الصديري (أخضر أنيق)
            ctx.fillStyle = "#2e7d32";
            ctx.fillRect(fx - 14, fy - 70, 28, 38);

            // الرأس والوجه
            ctx.fillStyle = "#ffccbc";
            ctx.beginPath();
            ctx.arc(fx, fy - 82, 12, 0, Math.PI * 2);
            ctx.fill();

            // الكاب (أحمر مميز)
            ctx.fillStyle = "#c62828";
            ctx.beginPath();
            ctx.arc(fx, fy - 86, 12, Math.PI, Math.PI * 2, false);
            ctx.fill();
            ctx.fillRect(fx, fy - 90, 16, 4); // حافة الكاب

            // 6. رسم صنارة الخيط
            const rodTipX = fx + 25;
            const rodTipY = fy - 80;
            ctx.strokeStyle = "#455a64";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(fx, fy - 50);
            ctx.lineTo(rodTipX, rodTipY);
            ctx.stroke();

            // خيط الصيد المتجه نحو إيماءة اللمس / الخطاف
            ctx.strokeStyle = isNight ? "#cfd8dc" : "#333333";
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(rodTipX, rodTipY);
            ctx.lineTo(hookX, hookY);
            ctx.stroke();

            // الخطاف في نهاية الخيط
            ctx.fillStyle = "#78909c";
            ctx.beginPath();
            ctx.arc(hookX, hookY, 5, 0, Math.PI * 2);
            ctx.fill();

            // 7. تحريك ورسم الأسماك باحترافية
            fishes.forEach(fish => {
                if(fish !== hookedFish) {
                    fish.x += fish.vx;
                    if(fish.x > canvas.width + 70) fish.x = -60;
                    if(fish.x < -70) fish.x = canvas.width + 60;
                }

                ctx.save();
                ctx.translate(fish.x, fish.y);
                if(fish.vx < 0) ctx.scale(-1, 1);

                // رسم جسم سمكة احترافي
                ctx.fillStyle = fish.color;
                ctx.beginPath();
                ctx.ellipse(0, 0, fish.size, fish.size * 0.5, 0, 0, Math.PI * 2);
                ctx.fill();

                // ذيل السمكة
                ctx.beginPath();
                ctx.moveTo(-fish.size, 0);
                ctx.lineTo(-fish.size - 15, -12);
                ctx.lineTo(-fish.size - 15, 12);
                ctx.closePath();
                ctx.fill();

                // عين السمكة
                ctx.fillStyle = "#000";
                ctx.beginPath();
                ctx.arc(fish.size * 0.5, -5, 3, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            });

            requestAnimationFrame(draw);
        }

        draw();
    </script>
</body>
</html>
