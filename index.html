<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة ضربات الجزاء 3D</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            background-color: #87CEFA;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #scoreboard {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 10px 25px;
            border-radius: 25px;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            gap: 25px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            z-index: 10;
        }
        .goals { color: #4CAF50; }
        .misses { color: #F44336; }

        #ui-controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 10;
        }
        .btn {
            background: #2196F3;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        #instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 8px 18px;
            border-radius: 15px;
            font-size: 14px;
            pointer-events: none;
            z-index: 10;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="scoreboard">
        <div>الأهداف: <span id="goals-count" class="goals">0</span></div>
        <div>الضائعة: <span id="misses-count" class="misses">0</span></div>
    </div>

    <div id="instructions">اسحب الكرة بأصبعك نحو المرمى للتسديد!</div>

    <div id="ui-controls">
        <button class="btn" onclick="changeKitColor()">تغيير لون القميص</button>
        <button class="btn" onclick="changeShortsColor()">تغيير لون الشورت</button>
    </div>

    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEFA);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 3.5, 14);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 30, 10);
        scene.add(dirLight);

        let goals = 0, misses = 0;
        let isKicking = false;
        let ballVelocity = new THREE.Vector3();
        const gravity = -9.8;
        let playerShirtMat, playerShortsMat;

        // الملعب
        const fieldGeo = new THREE.PlaneGeometry(60, 80);
        const fieldMat = new THREE.MeshLambertMaterial({ color: 0x2e7d32 });
        const field = new THREE.Mesh(fieldGeo, fieldMat);
        field.rotation.x = -Math.PI / 2;
        scene.add(field);

        // خط منطقة الجزاء
        const lineGeo = new THREE.PlaneGeometry(16, 0.2);
        const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const line = new THREE.Mesh(lineGeo, lineMat);
        line.rotation.x = -Math.PI / 2;
        line.position.set(0, 0.01, -2);
        scene.add(line);

        // المرمى والشبكة
        const goalGroup = new THREE.Group();
        const postMat = new THREE.MeshLambertMaterial({ color: 0xffffff });
        const postRadius = 0.12, goalWidth = 7.32, goalHeight = 2.44;

        const leftPost = new THREE.Mesh(new THREE.CylinderGeometry(postRadius, postRadius, goalHeight), postMat);
        leftPost.position.set(-goalWidth/2, goalHeight/2, -12);

        const rightPost = new THREE.Mesh(new THREE.CylinderGeometry(postRadius, postRadius, goalHeight), postMat);
        rightPost.position.set(goalWidth/2, goalHeight/2, -12);

        const crossbar = new THREE.Mesh(new THREE.CylinderGeometry(postRadius, postRadius, goalWidth), postMat);
        crossbar.rotation.z = Math.PI / 2;
        crossbar.position.set(0, goalHeight, -12);

        goalGroup.add(leftPost, rightPost, crossbar);

        const netGeo = new THREE.BoxGeometry(goalWidth, goalHeight, 1.5);
        const netMat = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true, transparent: true, opacity: 0.3 });
        const net = new THREE.Mesh(netGeo, netMat);
        net.position.set(0, goalHeight/2, -12.75);
        goalGroup.add(net);
        scene.add(goalGroup);

        // المدرجات والجمهور
        const standGeo = new THREE.BoxGeometry(70, 8, 10);
        const standMat = new THREE.MeshLambertMaterial({ color: 0x555555 });
        const stand = new THREE.Mesh(standGeo, standMat);
        stand.position.set(0, 4, -22);
        scene.add(stand);

        const crowdGroup = new THREE.Group();
        const spectatorGeo = new THREE.BoxGeometry(0.5, 0.9, 0.5);
        const crowdColors = [0xe74c3c, 0x3498db, 0xf1c40f, 0x9b59b6, 0x1abc9c, 0xe67e22];

        for(let x = -30; x <= 30; x += 1.5) {
            for(let z = -24; z <= -18; z += 1.8) {
                const color = crowdColors[Math.floor(Math.random() * crowdColors.length)];
                const specMat = new THREE.MeshLambertMaterial({ color: color });
                const spectator = new THREE.Mesh(spectatorGeo, specMat);
                spectator.position.set(x, 6.5 + (z + 24)*0.3, z);
                crowdGroup.add(spectator);
            }
        }
        scene.add(crowdGroup);

        // كرة القدم (أبيض وأحمر)
        function createBallCanvas() {
            const canvas = document.createElement('canvas');
            canvas.width = 128; canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, 128, 128);
            ctx.fillStyle = '#d32f2f';
            for (let i = 0; i < 128; i += 32) {
                for (let j = 0; j < 128; j += 32) {
                    if ((i + j) % 64 === 0) ctx.fillRect(i, j, 16, 16);
                }
            }
            return canvas;
        }

        const ballRadius = 0.35;
        const ballTexture = new THREE.CanvasTexture(createBallCanvas());
        const ballMat = new THREE.MeshLambertMaterial({ map: ballTexture });
        const ball = new THREE.Mesh(new THREE.SphereGeometry(ballRadius, 16, 16), ballMat);
        scene.add(ball);

        function resetBall() {
            ball.position.set(0, ballRadius, 6);
            ballVelocity.set(0, 0, 0);
            isKicking = false;
        }
        resetBall();

        // الشخصيات
        function createCharacter(shirtColor, shortsColor, shoeColor, hasHair) {
            const group = new THREE.Group();
            const shirtMat = new THREE.MeshLambertMaterial({ color: shirtColor });
            const shortsMat = new THREE.MeshLambertMaterial({ color: shortsColor });
            const skinMat = new THREE.MeshLambertMaterial({ color: 0xffdbac });
            const shoeMat = new THREE.MeshLambertMaterial({ color: shoeColor });
            const sockMat = new THREE.MeshLambertMaterial({ color: 0xffffff });

            const torso = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.9, 0.4), shirtMat);
            torso.position.y = 1.35;
            group.add(torso);

            const head = new THREE.Mesh(new THREE.SphereGeometry(0.25, 12, 12), skinMat);
            head.position.y = 2.05;
            group.add(head);

            if (hasHair) {
                const hairMat = new THREE.MeshLambertMaterial({ color: 0x1a1a1a });
                const hair = new THREE.Mesh(new THREE.SphereGeometry(0.28, 12, 12), hairMat);
                hair.position.set(0, 2.12, -0.02);
                group.add(hair);
            }

            const shorts = new THREE.Mesh(new THREE.BoxGeometry(0.72, 0.4, 0.42), shortsMat);
            shorts.position.y = 0.8;
            group.add(shorts);

            [-0.2, 0.2].forEach(x => {
                const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.6), sockMat);
                leg.position.set(x, 0.3, 0);
                group.add(leg);

                const shoe = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.12, 0.3), shoeMat);
                shoe.position.set(x, 0.06, 0.05);
                group.add(shoe);
            });

            return { group, shirtMat, shortsMat };
        }

        const playerObj = createCharacter(0xd32f2f, 0xffffff, 0x1976D2, true);
        const player = playerObj.group;
        playerShirtMat = playerObj.shirtMat;
        playerShortsMat = playerObj.shortsMat;
        player.position.set(-0.8, 0, 7.2);
        player.rotation.y = 0.2;
        scene.add(player);

        const keeperObj = createCharacter(0xfbc02d, 0xffffff, 0x333333, false);
        const keeper = keeperObj.group;
        keeper.position.set(0, 0, -11.5);
        scene.add(keeper);

        const kitColors = [0xd32f2f, 0x1976d2, 0x388e3c, 0x7b1fa2, 0xf57c00, 0x212121];
        let colorIdx = 0;

        function changeKitColor() {
            colorIdx = (colorIdx + 1) % kitColors.length;
            playerShirtMat.color.setHex(kitColors[colorIdx]);
        }

        function changeShortsColor() {
            const randomColor = kitColors[Math.floor(Math.random() * kitColors.length)];
            playerShortsMat.color.setHex(randomColor);
        }

        // التحكم في التسديد
        let touchStartX = 0, touchStartY = 0;

        window.addEventListener('pointerdown', (e) => {
            if (isKicking) return;
            touchStartX = e.clientX;
            touchStartY = e.clientY;
        });

        window.addEventListener('pointerup', (e) => {
            if (isKicking) return;
            const deltaX = e.clientX - touchStartX;
            const deltaY = e.clientY - touchStartY;

            if (deltaY < -20) {
                isKicking = true;
                const speedZ = Math.max(deltaY * 0.08, -22); 
                const speedX = deltaX * 0.03;
                const speedY = Math.min(-deltaY * 0.04, 10);

                ballVelocity.set(speedX, speedY, speedZ);

                const keeperJumpX = (Math.random() - 0.5) * (goalWidth - 1);
                keeper.position.x = keeperJumpX;
            }
        });

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            if (isKicking) {
                ballVelocity.y += gravity * delta;
                ball.position.addScaledVector(ballVelocity, delta);
                ball.rotation.x += ballVelocity.z * delta * 0.2;

                if (ball.position.y <= ballRadius) {
                    ball.position.y = ballRadius;
                    ballVelocity.y *= -0.5;
                    ballVelocity.x *= 0.8;
                    ballVelocity.z *= 0.8;
                }

                if (ball.position.z <= -11.8 && ball.position.z >= -13) {
                    const inGoalX = Math.abs(ball.position.x) < (goalWidth / 2 - ballRadius);
                    const inGoalY = ball.position.y < (goalHeight - ballRadius) && ball.position.y > 0;
                    const distToKeeper = ball.position.distanceTo(keeper.position);

                    if (inGoalX && inGoalY && distToKeeper > 1.2) {
                        registerResult(true);
                    } else {
                        registerResult(false);
                    }
                } else if (ball.position.z < -14 || Math.abs(ball.position.x) > 12) {
                    registerResult(false);
                }
            }

            renderer.render(scene, camera);
        }

        let resultProcessed = false;
        function registerResult(isGoal) {
            if (resultProcessed) return;
            resultProcessed = true;

            if (isGoal) {
                goals++;
                document.getElementById('goals-count').innerText = goals;
            } else {
                misses++;
                document.getElementById('misses-count').innerText = misses;
            }

            setTimeout(() => {
                resetBall();
                keeper.position.set(0, 0, -11.5);
                resultProcessed = false;
            }, 1800);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
